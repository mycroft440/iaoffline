name: Android CI + Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      IA_VERSION_CODE: ${{ github.run_number }}
      IA_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Native toolchain
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          sdkmanager --list_installed

      - name: Build llama.cpp Android binding
        env:
          LLAMA_CPP_TAG: v0.7.0
        run: ./scripts/prepare_llama_android.sh

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Test MoE prefetch cancellation
        run: python3 scripts/test_moe_prefetch.py

      - name: Unit tests + lint + debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace --info

      # The debug APK must be signed with app/debug.keystore. Signed with any other key (the
      # runner's own debug key, as before), Android refuses it as an update of the installed app.
      - name: Verify debug APK
        shell: bash
        env:
          DEBUG_CERT_SHA256: 6898c49482963e6abef1e5bd680f75fea4fe50865978938770ed62ebbd28f8c5
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          # A valid Gradle build is not enough: check ZIP data, Android metadata, alignment
          # and Android 13+ signing before handing the file to a phone.
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          # Inspect the actual installation-critical entries, not just the ZIP signature.
          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = apk.infolist()
              dex = [f for f in files if f.filename.endswith(".dex")]
              arm = [f for f in files if f.filename.startswith("lib/arm64-v8a/") and f.filename.endswith(".so")]
              intel = [f for f in files if f.filename.startswith("lib/x86_64/") and f.filename.endswith(".so")]
              assert dex, "APK has no DEX code"
              assert arm and intel, "APK lacks a native library for a supported ABI"
              assert all(f.compress_type == zipfile.ZIP_STORED for f in dex), "Legacy-compressed DEX regression detected"
              assert all(f.compress_type == zipfile.ZIP_DEFLATED for f in arm + intel), "Native lib extraction mode changed"
              assert apk.testzip() is None, "APK ZIP entry checksum mismatch"
              print(f"APK content OK: {len(dex)} stored DEX files; {len(arm)} ARM64 and {len(intel)} x86_64 native libraries")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/apk-package.txt"
          # aapt2 prints minSdkVersion, not sdkVersion. An incorrect grep previously
          # rejected a valid, correctly signed APK and blocked the release upload.
          grep -q "^minSdkVersion:'33'$" "$RUNNER_TEMP/apk-package.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 33 --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -q "certificate SHA-256 digest: $DEBUG_CERT_SHA256" "$RUNNER_TEMP/apk-certs.txt"
          mkdir -p dist-debug
          cp "$APK" "dist-debug/IA-Local-debug-${IA_VERSION_NAME}.apk"
          # A download that reaches the phone damaged is refused as "pacote inválido": its size
          # in the phone's file manager must match this one exactly.
          BYTES=$(stat -c %s "$APK")
          {
            echo "### IA-Local-debug-${IA_VERSION_NAME}.apk"
            echo
            echo "Tamanho: $(awk -v b="$BYTES" 'BEGIN { printf "%.2f MB", b / 1000000 }' | tr . ,) ($BYTES bytes)"
            echo
            echo "SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify a real installation, not only the APK ZIP/signature. Android's Package
      # Installer can reject packages for reasons that apksigner/aapt2 do not detect.
      # A failure here prints the Android INSTALL_* reason and prevents publishing a bad APK.
      - name: Permit Android emulator KVM acceleration
        shell: bash
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Smoke test APK installation on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_apk_install.sh app/build/outputs/apk/debug/app-debug.apk 4096

      # Newer ARM phones can use 16 KB memory pages. A normal x86_64 emulator uses
      # 4 KB pages and cannot detect all OEM installation failures. The experimental
      # Android 15 16-KB system image tests a second, materially different installer.
      - name: Smoke test APK installation on Android 15 (16 KB pages)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_apk_install.sh app/build/outputs/apk/debug/app-debug.apk 16384

      # The APK itself, not a ZIP (archive: false): the artifact is named after the file and
      # downloads as IA-Local-debug-0.1.N.apk, ready to install on a phone. A ZIP had to be
      # extracted first, and Android's ZIP reader rejected the uncompressed ones Actions used to
      # stream. The version in the name tells the newest download apart: an older APK cannot be
      # installed over a newer one either.
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          path: dist-debug/IA-Local-debug-${{ env.IA_VERSION_NAME }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Release assets download as the APK itself, without artifact ZIP wrappers.
      # This is a test prerelease, still signed with the project's existing debug key.
      - name: Publish direct-install test APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" dist-debug/IA-Local-teste.apk
          (cd dist-debug && sha256sum IA-Local-teste.apk > IA-Local-teste.apk.sha256)
          BYTES=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/preview-notes.md" <<EOF
          APK de teste da versão ${IA_VERSION_NAME}, compilação ${GITHUB_SHA}.

          Baixe diretamente o arquivo IA-Local-teste.apk nos anexos.
          NÃO baixe "Source code (zip)", AAB, nem um artefato ZIP.

          - Android 13 ou superior (minSdk 33), processadores 64 bits arm64-v8a/x86_64.
          - Tamanho esperado: ${BYTES} bytes.
          - SHA-256: ${SHA}.
          - Assinado com a chave de debug estável do projeto, não com a chave de produção.
          - Se o app instalado tiver outra assinatura, faça backup antes de desinstalar:
            Android não permite atualizar entre assinaturas distintas.
          EOF
          TAG="teste-atual"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-debug/IA-Local-teste.apk --clobber
            gh release upload "$TAG" dist-debug/IA-Local-teste.apk.sha256 --clobber
            gh release edit "$TAG" --prerelease --title "IA Local - Teste ${IA_VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$TAG" dist-debug/IA-Local-teste.apk \
              dist-debug/IA-Local-teste.apk.sha256 \
              --prerelease --target "$GITHUB_SHA" \
              --title "IA Local - Teste ${IA_VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
          # Read back the actual GitHub Release asset and compare byte-for-byte with our
          # signed package. Detects an HTML response, ZIP envelope or damaged upload.
          mkdir -p "$RUNNER_TEMP/preview-check"
          gh release download "$TAG" --pattern 'IA-Local-teste.apk' \
            --dir "$RUNNER_TEMP/preview-check" --clobber
          cmp "$APK" "$RUNNER_TEMP/preview-check/IA-Local-teste.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "$RUNNER_TEMP/preview-check/IA-Local-teste.apk"
          {
            echo "### APK de teste com download direto (Android 13+)"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/teste-atual/IA-Local-teste.apk"
            echo
            echo "Versão: ${IA_VERSION_NAME} | ${BYTES} bytes | SHA-256: ${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check persistent release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped. Configure repository secrets: ${missing[*]}"
            {
              echo "### Signed release skipped"
              echo
              echo "Configure the four Android signing secrets documented in README.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release.keystore"
          test -s "$GITHUB_WORKSPACE/app/release.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK + AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.ADMOB_NATIVE_AD_UNIT_ID }}
          ADMOB_APP_OPEN_AD_UNIT_ID: ${{ secrets.ADMOB_APP_OPEN_AD_UNIT_ID }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -f "$APK"
          test -f "$AAB"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p dist
          cp "$APK" dist/IA-Local.apk
          cp "$AAB" dist/IA-Local.aab
          sha256sum dist/IA-Local.apk > dist/IA-Local.apk.sha256
          ls -lh dist/IA-Local.apk dist/IA-Local.aab dist/IA-Local.apk.sha256

      # The APK unzipped, like the debug one; the bundle and the checksum go in a ZIP.
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/IA-Local.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: IA-Local-signed-release
          path: |
            dist/IA-Local.aab
            dist/IA-Local.apk.sha256
          if-no-files-found: error
          retention-days: 14
          # Never 0: Actions streams the ZIP with data descriptors, and Android's ZIP reader
          # (java.util.zip.ZipInputStream) rejects an uncompressed entry that has one.
          compression-level: 6

      - name: Publish direct-download GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${IA_VERSION_NAME}"
          TITLE="IA Local ${IA_VERSION_NAME}"
          NOTES="APK instalável para Android 13+ (arm64-v8a/x86_64). Baixe IA-Local.apk diretamente desta Release; o arquivo AAB é destinado a distribuição por loja e não deve ser instalado diretamente."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/IA-Local.apk \
              dist/IA-Local.aab \
              dist/IA-Local.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/IA-Local.apk \
              dist/IA-Local.aab \
              dist/IA-Local.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          {
            echo "### Signed release published"
            echo
            echo "Version: ${IA_VERSION_NAME}"
            echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/IA-Local.apk"
            echo "GitHub-generated artifact ZIP: IA-Local-signed-release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release keystore
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f app/release.keystore
