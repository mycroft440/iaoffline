name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Gradle 9.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Native toolchain
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          sdkmanager --list_installed

      - name: Build llama.cpp Android binding
        id: llama_build
        env:
          LLAMA_CPP_TAG: v0.4.0
        shell: bash
        run: |
          set +e
          ./scripts/prepare_llama_android.sh 2>&1 | tee /tmp/llama-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish native build error on PR
        if: ${{ failure() && github.event_name == 'pull_request' && steps.llama_build.outputs.status != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/llama-build.log')
              ? fs.readFileSync('/tmp/llama-build.log', 'utf8')
              : 'Log nativo não encontrado.';
            const tail = log.split('\n').slice(-180).join('\n').slice(-60000);
            const marker = '<!-- iaoffline-native-build-diagnostic -->';
            const body = `${marker}\n### Diagnóstico temporário da build nativa\n\n\`\`\`text\n${tail}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Unit tests + debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
