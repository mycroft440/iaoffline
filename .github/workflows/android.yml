name: Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Native toolchain
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          sdkmanager --list_installed

      - name: Build llama.cpp Android binding
        env:
          LLAMA_CPP_TAG: v0.4.0
        run: ./scripts/prepare_llama_android.sh

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Unit tests + lint + debug APK + debug AAB
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace 2>&1 | tee gradle-ci.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-ci-log
          path: gradle-ci.log
          if-no-files-found: warn
          retention-days: 1

      - name: Verify Android artifacts
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
