name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle 9.6
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build llama.cpp Android binding
        env:
          LLAMA_CPP_TAG: v0.4.0
        run: ./scripts/prepare_llama_android.sh

      - name: Unit tests + debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
