name: Android APK + AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Native toolchain
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          sdkmanager --list_installed

      - name: Maximum offline Tree-sitter grammar bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-ndk --locked
          chmod +x ./scripts/prepare_tree_sitter_android.sh
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export ANDROID_NDK_HOME="${ANDROID_SDK}/ndk/29.0.13113456"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export TREE_SITTER_LANGUAGES="all"
          ./scripts/prepare_tree_sitter_android.sh
          test -f app/libs/tree-sitter-language-pack-android-max.aar
          ls -lh app/libs/tree-sitter-language-pack-android-max.aar

      - name: Build llama.cpp Android binding
        env:
          LLAMA_CPP_TAG: v0.4.0
        run: ./scripts/prepare_llama_android.sh

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Unit tests + lint + debug APK + debug AAB
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Verify Android artifacts
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: IA-Local-debug-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
